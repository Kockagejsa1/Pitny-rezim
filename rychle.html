<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Přidat 250 ml · Pitný režim</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f9fd;color:#15324b;font-family:system-ui,sans-serif;text-align:center;padding:24px}.card{width:min(100%,380px);background:white;border-radius:24px;padding:28px;box-shadow:0 8px 28px #1d5b8010}h1{font-size:24px;margin:0 0 10px}.amount{font-size:42px;font-weight:850;color:#1689e8;margin:10px}p{color:#64788a}a{display:inline-block;background:#1689e8;color:white;text-decoration:none;padding:13px 18px;border-radius:13px;font-weight:750;margin-top:10px}
</style>
</head>
<body><main class="card"><h1>Pitný režim</h1><div class="amount">+250 ml 💧</div><p id="status">Přidávám sklenici vody…</p><a href="./">Otevřít celou aplikaci</a></main>
<script>
(function(){
 const KEY='pitny-rezim-v1', now=new Date(), pad=n=>String(n).padStart(2,'0');
 const day=now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate());
 let state;try{state=JSON.parse(localStorage.getItem(KEY))||{days:{},lastDay:day}}catch(e){state={days:{},lastDay:day}}
 if(!state.days)state.days={};
 if(!state.days[day])state.days[day]={total:0,entries:[]};
 const t=state.days[day];if(!Array.isArray(t.entries))t.entries=[];
 t.entries=t.entries.map(e=>typeof e==='number'?{amount:e,time:null}:e);
 t.entries.push({amount:250,time:now.toISOString()});t.total=(t.total||0)+250;
 localStorage.setItem(KEY,JSON.stringify(state));
 document.getElementById('status').textContent='Přidáno! Dnes celkem '+t.total.toLocaleString('cs-CZ')+' ml.';
 if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script></body></html>
